services:
  app:
    image: ghcr.io/yueyanc/worldmonitor-app:${IMAGE_TAG:?IMAGE_TAG required}
    container_name: worldmonitor-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WM_PORT:-3480}:8080"
    environment:
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required}"
      LOCAL_API_PORT: "46123"
      LOCAL_API_MODE: "docker"
      LOCAL_API_CLOUD_FALLBACK: "false"
      WS_RELAY_URL: "http://ais-relay:3004"
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required}"
    depends_on:
      redis-rest:
        condition: service_started
      ais-relay:
        condition: service_started
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  ais-relay:
    image: ghcr.io/yueyanc/worldmonitor-relay:${IMAGE_TAG:?IMAGE_TAG required}
    container_name: worldmonitor-ais-relay
    restart: unless-stopped
    environment:
      PORT: "3004"
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required}"
      UPSTASH_ALLOW_INSECURE_HTTP: "true"
      RELAY_SHARED_SECRET: "${RELAY_SHARED_SECRET:?RELAY_SHARED_SECRET required}"
    depends_on:
      redis-rest:
        condition: service_started
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: worldmonitor-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD required}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  redis-rest:
    image: ghcr.io/yueyanc/worldmonitor-redis-rest:${IMAGE_TAG:?IMAGE_TAG required}
    container_name: worldmonitor-redis-rest
    restart: unless-stopped
    environment:
      SRH_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required}"
      SRH_CONNECTION_STRING: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379"
    depends_on:
      - redis
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  seeder:
    image: ghcr.io/yueyanc/worldmonitor-seeder:${IMAGE_TAG:?IMAGE_TAG required}
    environment:
      REDIS_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required}"
      UPSTASH_REDIS_REST_URL: "http://redis-rest:80"
      UPSTASH_REDIS_REST_TOKEN: "${REDIS_TOKEN:?REDIS_TOKEN required}"
      SEED_TIMEOUT: "900"
    depends_on:
      redis-rest:
        condition: service_started
    profiles:
      - tools

volumes:
  redis-data:
