name: Deploy World Monitor to AlphaVPS

on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check the server without deploying
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: worldmonitor-alphavps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  preflight:
    name: Server preflight
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.ALPHAVPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALPHAVPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/alphavps
          printf '%s\n' "$SSH_KEY" > ~/.ssh/alphavps
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Inspect AlphaVPS
        env:
          VPS_HOST: ${{ vars.ALPHAVPS_HOST }}
          VPS_PORT: ${{ vars.ALPHAVPS_PORT }}
          VPS_USER: ${{ vars.ALPHAVPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/alphavps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "host=$(hostname)"
          echo "arch=$(uname -m)"
          echo "cpu=$(nproc)"
          free -h
          df -h /
          docker version --format 'docker={{.Server.Version}}'
          docker compose version
          test -d /opt/1panel/www/conf.d
          docker inspect 1Panel-openresty-Xdjb >/dev/null
          if ss -ltnH | awk '{print $4}' | grep -Eq '(^|:)3480$'; then
            if ! docker ps --format '{{.Names}}' | grep -qx worldmonitor-app; then
              echo "port 3480 is already occupied by another service" >&2
              exit 1
            fi
          fi
          if [ -f /opt/worldmonitor/docker-compose.yml ]; then
            cd /opt/worldmonitor
            docker compose ps
            systemctl is-active worldmonitor-seed.timer || true
            systemctl is-active worldmonitor-seed.service || true
            systemctl status worldmonitor-seed.timer --no-pager -n 10 || true
            journalctl -u worldmonitor-seed.service --no-pager -n 20 || true
            docker logs --tail 40 worldmonitor-ais-relay || true
          fi
          REMOTE

  build:
    name: Build ${{ matrix.name }}
    needs: preflight
    if: ${{ inputs.preflight_only != true }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            image: worldmonitor-app
            context: .
          - name: relay
            dockerfile: Dockerfile.relay
            image: worldmonitor-relay
            context: .
          - name: redis-rest
            dockerfile: docker/Dockerfile.redis-rest
            image: worldmonitor-redis-rest
            context: docker
          - name: seeder
            dockerfile: Dockerfile.seeder
            image: worldmonitor-seeder
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/yueyanc/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/yueyanc/${{ matrix.image }}:alphavps
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy
    needs:
      - preflight
      - build
    if: ${{ inputs.preflight_only != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.ALPHAVPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALPHAVPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/alphavps
          printf '%s\n' "$SSH_KEY" > ~/.ssh/alphavps
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy deploy files
        env:
          VPS_HOST: ${{ vars.ALPHAVPS_HOST }}
          VPS_PORT: ${{ vars.ALPHAVPS_PORT }}
          VPS_USER: ${{ vars.ALPHAVPS_USER }}
        run: |
          set -euo pipefail
          remote_dir="/tmp/worldmonitor-deploy-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/alphavps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "install -d -m 700 '$remote_dir'"
          scp -i ~/.ssh/alphavps -P "$VPS_PORT" \
            deploy/alphavps/docker-compose.yml \
            deploy/alphavps/worldmonitor.yueyanc.cn.conf \
            deploy/alphavps/worldmonitor-seed.service \
            deploy/alphavps/worldmonitor-seed.timer \
            "$VPS_USER@$VPS_HOST:$remote_dir/"

      - name: Deploy on AlphaVPS
        env:
          GHCR_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ vars.ALPHAVPS_HOST }}
          VPS_PORT: ${{ vars.ALPHAVPS_PORT }}
          VPS_USER: ${{ vars.ALPHAVPS_USER }}
        run: |
          set -euo pipefail
          remote_dir="/tmp/worldmonitor-deploy-${GITHUB_RUN_ID}"
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/alphavps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "install -d -m 700 '$remote_dir/docker-auth' && DOCKER_CONFIG='$remote_dir/docker-auth' docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

          ssh -i ~/.ssh/alphavps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            IMAGE_TAG="$GITHUB_SHA" REMOTE_DIR="$remote_dir" 'bash -s' <<'REMOTE'
          set -euo pipefail

          install -d -m 755 /opt/worldmonitor
          install -m 644 "$REMOTE_DIR/docker-compose.yml" /opt/worldmonitor/docker-compose.yml
          install -m 644 "$REMOTE_DIR/worldmonitor.yueyanc.cn.conf" /opt/1panel/www/conf.d/worldmonitor.yueyanc.cn.conf
          install -m 644 "$REMOTE_DIR/worldmonitor-seed.service" /etc/systemd/system/worldmonitor-seed.service
          install -m 644 "$REMOTE_DIR/worldmonitor-seed.timer" /etc/systemd/system/worldmonitor-seed.timer

          cd /opt/worldmonitor
          if [ ! -f .env ]; then
            umask 077
            {
              echo "IMAGE_TAG=$IMAGE_TAG"
              echo "WM_PORT=3480"
              echo "REDIS_PASSWORD=$(openssl rand -hex 32)"
              echo "REDIS_TOKEN=$(openssl rand -hex 32)"
              echo "RELAY_SHARED_SECRET=$(openssl rand -hex 32)"
            } > .env
          elif grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
          else
            printf '\nIMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
          fi
          chmod 600 .env

          export DOCKER_CONFIG="$REMOTE_DIR/docker-auth"
          docker compose pull
          docker compose up -d --remove-orphans

          docker exec 1Panel-openresty-Xdjb nginx -t
          docker exec 1Panel-openresty-Xdjb nginx -s reload

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3480/api/sidecar-health >/dev/null; then
              break
            fi
            if [ "$attempt" = "60" ]; then
              docker compose ps
              docker logs --tail 160 worldmonitor-app
              docker logs --tail 160 worldmonitor-ais-relay
              exit 1
            fi
            sleep 2
          done

          docker compose --profile tools run --rm -T seeder node scripts/seed-earthquakes.mjs </dev/null

          systemctl daemon-reload
          systemctl enable --now worldmonitor-seed.timer
          systemctl start --no-block worldmonitor-seed.service || true

          curl -fsS -H 'Host: worldmonitor.yueyanc.cn' http://127.0.0.1/ >/dev/null
          curl -fsS --resolve worldmonitor.yueyanc.cn:443:127.0.0.1 https://worldmonitor.yueyanc.cn/ >/dev/null
          curl -fsS --resolve worldmonitor.yueyanc.cn:443:127.0.0.1 https://worldmonitor.yueyanc.cn/api/health?compact=1

          rm -rf "$REMOTE_DIR"
          docker image prune -f --filter 'until=168h' || true
          REMOTE
